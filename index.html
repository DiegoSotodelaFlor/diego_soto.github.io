<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entorno Cliente · Diego Soto de la Flor</title>
  <meta name="description" content="Prácticas y ejercicios del módulo Desarrollo Web en Entorno Cliente (DAW).">
  <style>
    :root {
      --bg: #e9eef1;
      --ink: #14212b;
      --muted: #4d5f6b;
      --line: #b9c6ce;
      --accent: #f2c230;
      --link: #1b5f69;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a21;
        --ink: #e6edf1;
        --muted: #93a6b2;
        --line: #2c3f4c;
        --link: #7cc7d1;
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--ink);
      font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 46rem; margin: 0 auto; padding: 4rem 1.25rem 3rem; }

    h1 {
      font: 700 clamp(2.6rem, 9vw, 4.6rem)/1 Georgia, "Times New Roman", serif;
      letter-spacing: -0.02em;
      margin: 0 0 1rem;
      padding-bottom: 1.2rem;
      border-bottom: 6px solid var(--accent);
    }
    .lead { color: var(--muted); max-width: 36rem; margin: 0 0 3rem; }

    h2 { font: 700 1.35rem/1.3 Georgia, serif; margin: 0 0 .25rem; }
    .ruta-grupo { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }

    ul.practicas { list-style: none; margin: 0 0 3rem; padding: 0; }
    .practicas li { border-top: 1px solid var(--line); }
    .practicas li:last-child { border-bottom: 1px solid var(--line); }
    .practicas a {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .25rem 1rem;
      padding: 1rem .5rem;
      color: inherit;
      text-decoration: none;
    }
    .practicas a:hover, .practicas a:focus-visible { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .practicas a:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
    .titulo { font-weight: 600; }
    .tema { color: var(--muted); font-size: .9rem; text-align: right; }
    .desc { grid-column: 1 / -1; color: var(--muted); font-size: .95rem; }
    .vacio { color: var(--muted); padding: 1rem 0; }

    footer { color: var(--muted); font-size: .9rem; }
    footer a { color: var(--link); }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

    @media (max-width: 30rem) {
      .practicas a { grid-template-columns: 1fr; }
      .tema { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Entorno Cliente</h1>
    <p class="lead">
      Prácticas y ejercicios del módulo de Desarrollo Web en Entorno Cliente,
      del grado de Desarrollo de Aplicaciones Web. Por Diego Soto de la Flor.
    </p>

    <div id="contenido"><p class="ruta-grupo">Cargando prácticas…</p></div>

    <footer>
      <a href="https://github.com/DiegoSotodelaFlor/D.ENTORNO-CLIENTE">Ver el repositorio en GitHub</a>
    </footer>
  </main>

  <script>
    // Configuración del repositorio
    const USUARIO = "DiegoSotodelaFlor";
    const REPO = "D.ENTORNO-CLIENTE";
    const RAMA = "main";

    // Opcional: descripciones para archivos concretos (ruta completa => texto)
    const descripciones = {
      "Tema1/Tarea 1/3.html": "Preguntas de verdadero o falso que cambian de color según la respuesta."
    };

    const contenido = document.getElementById("contenido");
    const collator = new Intl.Collator("es", { numeric: true, sensitivity: "base" });

    function nombreLegible(archivo) {
      const base = archivo.replace(/\.html?$/i, "");
      if (/^\d+$/.test(base)) return "Ejercicio " + base;
      return base.replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, "$1 $2");
    }

    async function cargarArbol() {
      const clave = "arbol:" + REPO;
      try {
        const guardado = sessionStorage.getItem(clave);
        if (guardado) return JSON.parse(guardado);
      } catch (e) {}

      const url = `https://api.github.com/repos/${USUARIO}/${encodeURIComponent(REPO)}/git/trees/${RAMA}?recursive=1`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("GitHub respondió " + resp.status);
      const datos = await resp.json();
      const rutas = datos.tree
        .filter(n => n.type === "blob" && /\.html?$/i.test(n.path))
        .map(n => n.path)
        .filter(p => p !== "index.html" && !p.split("/").some(parte => parte.startsWith(".") || parte === "node_modules"));

      try { sessionStorage.setItem(clave, JSON.stringify(rutas)); } catch (e) {}
      return rutas;
    }

    function pintar(rutas) {
      const grupos = new Map();
      for (const ruta of rutas) {
        const i = ruta.lastIndexOf("/");
        const carpeta = i === -1 ? "" : ruta.slice(0, i);
        const archivo = ruta.slice(i + 1);
        if (!grupos.has(carpeta)) grupos.set(carpeta, []);
        grupos.get(carpeta).push({ ruta, archivo });
      }

      contenido.replaceChildren();
      if (grupos.size === 0) {
        contenido.innerHTML = '<p class="ruta-grupo">Todavía no hay prácticas publicadas.</p>';
        return;
      }

      const carpetas = [...grupos.keys()].sort(collator.compare);
      for (const carpeta of carpetas) {
        const h = document.createElement("h2");
        h.textContent = carpeta ? carpeta.split("/").join(" · ") : "Raíz";

        const r = document.createElement("p");
        r.className = "ruta-grupo";
        r.textContent = carpeta ? carpeta + "/" : "/";

        const ul = document.createElement("ul");
        ul.className = "practicas";

        const items = grupos.get(carpeta).sort((a, b) => collator.compare(a.archivo, b.archivo));
        for (const it of items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = encodeURI(it.ruta);

          const t = document.createElement("span");
          t.className = "titulo";
          t.textContent = nombreLegible(it.archivo);

          const m = document.createElement("span");
          m.className = "tema";
          m.textContent = it.archivo.length > 24 ? "HTML" : it.archivo;

          a.append(t, m);

          if (descripciones[it.ruta]) {
            const d = document.createElement("span");
            d.className = "desc";
            d.textContent = descripciones[it.ruta];
            a.append(d);
          }
          li.append(a);
          ul.append(li);
        }
        contenido.append(h, r, ul);
      }
    }

    cargarArbol()
      .then(pintar)
      .catch(err => {
        contenido.innerHTML = '<p class="ruta-grupo">No se pudo cargar la lista de prácticas (' + err.message +
          '). Recarga la página en unos minutos o mira el repositorio en GitHub.</p>';
      });
  </script>
</body>
</html>
